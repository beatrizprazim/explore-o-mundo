          M115 225
          C125 217 138 218 145 226
          C152 223 161 227 163 235
          C153 241 141 242 129 239
          C120 238 113 233 115 225Z
        "
      />

      <path
        d="
          M222 112
          C233 105 247 108 253 116
          C263 112 273 117 275 126
          C262 132 248 130 236 127
          C226 125 218 120 222 112Z
        "
      />

      <path
