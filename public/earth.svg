<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 500 500"
  role="img"
  aria-labelledby="title desc"
>

  <title id="title">Planeta Terra</title>
  <desc id="desc">
    Ilustração estilizada do planeta Terra vista do espaço.
  </desc>

  <defs>

    <!-- Gradiente do oceano -->
    <radialGradient id="ocean" cx="35%" cy="28%" r="75%">
      <stop offset="0%" stop-color="#55b9d2"/>
      <stop offset="45%" stop-color="#2187a5"/>
      <stop offset="100%" stop-color="#07536f"/>
    </radialGradient>

    <!-- Brilho da atmosfera -->
    <radialGradient id="atmosphere">
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="88%" stop-color="#bce8f2" stop-opacity=".22"/>
      <stop offset="96%" stop-color="#8bd3e2" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- Sombra do planeta -->
    <linearGradient id="shadow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".15"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#062f42" stop-opacity=".55"/>
    </linearGradient>

    <!-- Continentes -->
    <linearGradient id="land" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#78ad68"/>
      <stop offset="100%" stop-color="#397b4d"/>
    </linearGradient>

    <!-- Recorte circular -->
    <clipPath id="earthClip">
      <circle cx="250" cy="250" r="185"/>
    </clipPath>

    <!-- Sombra externa -->
    <filter id="planetShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow
        dx="0"
        dy="18"
        stdDeviation="18"
        flood-color="#173f45"
        flood-opacity=".22"
      />
    </filter>

  </defs>


  <!-- ATMOSFERA -->

  <circle
    cx="250"
    cy="250"
    r="220"
    fill="url(#atmosphere)"
  />


  <!-- PLANETA -->

  <circle
    cx="250"
    cy="250"
    r="185"
    fill="url(#ocean)"
    filter="url(#planetShadow)"
  />


  <g clip-path="url(#earthClip)">

    <!-- LINHAS DE LATITUDE -->

    <ellipse
      cx="250"
      cy="250"
      rx="183"
      ry="62"
      fill="none"
      stroke="#bde6ee"
      stroke-width="1.5"
      opacity=".18"
    />

    <ellipse
      cx="250"
      cy="250"
      rx="183"
      ry="120"
      fill="none"
      stroke="#bde6ee"
      stroke-width="1.5"
      opacity=".14"
    />

    <ellipse
      cx="250"
      cy="250"
      rx="183"
      ry="165"
      fill="none"
      stroke="#bde6ee"
      stroke-width="1.5"
      opacity=".10"
    />


    <!-- LINHAS DE LONGITUDE -->

    <ellipse
      cx="250"
      cy="250"
      rx="65"
      ry="185"
      fill="none"
      stroke="#bde6ee"
      stroke-width="1.5"
      opacity=".14"
    />

    <ellipse
