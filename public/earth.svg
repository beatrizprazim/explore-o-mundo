    </g>


    <!-- SOMBRA -->

    <circle
      cx="250"
      cy="250"
      r="185"
      fill="url(#shadow)"
    />

  </g>


  <!-- BORDA DA TERRA -->

  <circle
    cx="250"
    cy="250"
    r="185"
    fill="none"
    stroke="#b9e5ed"
    stroke-width="4"
    opacity=".65"
  />


  <!-- BRILHO SUPERIOR -->

  <path
    d="
      M116 185
      C137 122 192 80 257 72
      C200 96 155 135 137 194
      C130 217 126 238 127 257
      C114 235 108 208 116 185Z
    "
